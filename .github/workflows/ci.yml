name: CI — масовий баланс і напрямки ефектів (G3/G5)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Масовий баланс C/N/ґрунту + напрямки ефектів (28 тестів)
        run: node validation/mass_balance.js
      - name: QA релізу G7 (24 тести, включно з G3/G5)
        run: node validation/qa_release.js
