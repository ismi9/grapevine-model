# Реєстр параметрів ядра Tier 1
# Кожен параметр: значення, одиниця, діапазон, статус джерела.
# status: ASSUMPTION = прийнято за припущенням з обґрунтуванням (підлягає калібруванню, етап E6);
#         TZ §8 = орієнтовний діапазон із технічного завдання (розділ 8);
#         NOT_VERIFIED = вимагає верифікації за літературою (Agent 1, етап E1).

core:
  eps0:
    value: 0.85
    unit: "g C / mol PPFD intercepted"
    range: [0.6, 1.2]
    status: ASSUMPTION
    rationale: "Агрегат радіаційної ефективності (RUE ~ 1.1–1.5 г DM/MJ PAR в оптимумі). Калібрувальний."
  rm_base:
    value: 0.006
    unit: "g C · g⁻¹ DM · day⁻¹ (при 20 °C)"
    range: [0.004, 0.012]
    status: ASSUMPTION
    rationale: "Дихання підтримки ~ 40–50 % GPP за сезон. Q10 = 2.0 (стартове, верифікувати)."
  growth_cost:
    value: 1.4
    unit: "g C assimilate / g C in product"
    range: [1.2, 1.6]
    status: ASSUMPTION
    rationale: "Penning de Vries-типу: середня вартість синтезу структурних вуглеводнів, білків, органічних кислот."
  sla:
    value: 0.02
    unit: "m² leaf / g DM"
    range: [0.015, 0.026]
    status: ASSUMPTION
    rationale: "SLA ≈ 15–25 м²/кг для Vitis."
  k_ext:
    value: 0.7
    unit: "-"
    range: [0.5, 1.0]
    status: ASSUMPTION
    rationale: "Коефіцієнт екстинкції світла в кроні виноградника."
  q10_maint:
    value: 2.0
    unit: "-"
    range: [1.8, 2.3]
    status: ASSUMPTION
  q10_malate:
    value: 2.1
    unit: "-"
    status: ASSUMPTION
    rationale: "Температурна залежність дихання малату після véraison."

nitrogen:
  vmax_n:
    value: 0.15
    unit: "g N / vine / day (20 °C)"
    range: [0.10, 0.30]
    status: ASSUMPTION
    rationale: "Сезонне поглинання ~ 25–35 г N/куш (≈ 30–60 кг/га при 4000 кущів/га в межах площ живлення)."
  km_n:
    value: 0.05
    unit: "g N / vine"
    status: ASSUMPTION
  n_conc:
    leaf: {value: 0.024, unit: "g N / g DM", status: ASSUMPTION, note: "оптимум; діапазон 0.02–0.03"}
    shoot: {value: 0.010, unit: "g N / g DM", status: ASSUMPTION}
    root: {value: 0.013, unit: "g N / g DM", status: ASSUMPTION}
    wood: {value: 0.004, unit: "g N / g DM", status: ASSUMPTION}
    berry: {value: 0.006, unit: "g N / g DM", status: ASSUMPTION}
  soil_fertility:
    poor:   {initialN: 12, mineralization: 0.15, unit: "kg N/ha; kg N/ha/day @15 °C", status: ASSUMPTION}
    medium: {initialN: 30, mineralization: 0.35, unit: "kg N/ha; kg N/ha/day @15 °C", status: ASSUMPTION}
    rich:   {initialN: 55, mineralization: 0.65, unit: "kg N/ha; kg N/ha/day @15 °C", status: ASSUMPTION}
  leach_rate:
    value: 0.018
    unit: "day⁻¹ (частка мінерального N при вологості ≥ 0.7)"
    status: ASSUMPTION

berry:
  malate_l:
    value: 12
    unit: "g / L must при накопиченні до véraison"
    range: [10, 16]
    status: TZ §8
  tartrate_l:
    value: 10
    unit: "g / L must"
    status: TZ §8
  k_malate_resp:
    value: 0.07
    unit: "day⁻¹ при 25 °C"
    status: ASSUMPTION
  sugar_rate:
    value: 6.8
    unit: "g sugar / kg berries / day (при L:F оптимумі, 25 °C, повних факторах)"
    status: ASSUMPTION
    note: "калібрувальний; L:F-фактор 0.35–1.25"
  berry_k_l:
    value: 1.8
    unit: "g K / L must (при kSupply = 1)"
    range: [1.5, 2.5]
    status: ASSUMPTION

terpenes:
  terp_synth_base:
    muscat_blanc: {value: 45, unit: "µg/kg berries/day (пік, оптимальні фактори)", status: ASSUMPTION}
    muscat_alexandria: {value: 30, status: ASSUMPTION}
    muscat_ottonel: {value: 23, status: ASSUMPTION}
    muscat_hamburg: {value: 27, status: ASSUMPTION}
    rationale: "Калібрувальний проксі активності MEP-шляху (VvDXS1). Ціль за §8: сумарні вільні монотерпеноли мускату білого ~ 400–1600 мкг/кг. НЕ ВЕРИФІКОВАНО."
  dxs_activity:
    muscat_blanc: 1.00
    muscat_alexandria: 0.72
    muscat_ottonel: 0.55
    muscat_hamburg: 0.62
    status: ASSUMPTION
    note: "Проксі поліморфізму VvDXS1; верифікувати за літературою (E1)."
  gly_rate: {value: 0.045, unit: "day⁻¹ × f(T enzyme)", status: ASSUMPTION}
  loss_base: {value: 0.008, unit: "day⁻¹ × f(T enzyme) + hot extra", status: ASSUMPTION}
  muscat_index_scale:
    value: 7
    unit: "µg/kg вільних монотерпенолів за 1 пункт індексу (0–100)"
    status: ASSUMPTION

variety_targets:   # орієнтири правдоподібності (розділ 8 ТЗ)
  brix_harvest: {range: [18, 24], unit: "°Bx", status: TZ §8}
  ta_harvest: {range: [4, 9], unit: "g/L tartaric eq.", status: TZ §8}
  ph_harvest: {range: [3.0, 3.6], status: TZ §8}
  berry_mass_muscat_blanc: {range: [1, 2], unit: "g", status: TZ §8}
  lai_full: {range: [1.5, 3.5], status: TZ §8}

# ============================================================
# TIER 2 (етап E5) — кінетика, форми N, MEP-мережа терпеноїдів
# ============================================================
tier2_photosynthesis:
  vcmax25_base:
    value: 70
    unit: "µmol CO₂·m⁻²·s⁻¹ (при N листя = оптимум)"
    range: [55, 90]
    status: ASSUMPTION
    rationale: "Vcmax ← N_Rubisco; зв'язок ^0.7. Літературні діапазони для Vitis — верифікувати (E1)."
  fV_temp:
    value: "Ha 50 kJ/mol, дезактивація >34 °C (sigmoid, 2° ширина)"
    status: ASSUMPTION
    rationale: "D-006: точні константи Bernacchi/Kattge-Knorr визнані неперевіреними; прозора емпірична крива."
  ci_ratio:
    value: 0.70
    unit: "частка ci/ca"
    range: [0.6, 0.8]
    status: ASSUMPTION
    note: "× f(вода) — продихова відповідь (спрощений Medlyn)"
  alpha_electron:
    value: 0.30
    unit: "mol e⁻ / mol photon (ефективність)"
    status: ASSUMPTION

tier2_nitrogen:
  vmax_no3: {value: 0.12, unit: "g N/vine/day @20°C", status: ASSUMPTION}
  km_no3: {value: 0.05, unit: "g N/vine", status: ASSUMPTION}
  vmax_nh4: {value: 0.08, unit: "g N/vine/day @20°C", status: ASSUMPTION}
  km_nh4: {value: 0.02, unit: "g N/vine", status: ASSUMPTION, note: "вища спорідненість NH₄⁺"}
  nitrate_reduct_cost:
    value: 0.60
    unit: "g C / g N"
    status: ASSUMPTION
    rationale: "~3.4 проти 1.9 г глюкози/г N для нітратного проти амонійного шляху; верифікувати."
  nh4_assim_cost: {value: 0.05, unit: "g C / g N", status: ASSUMPTION}
  nitrate_store_cap: {value: 1.2, unit: "g N/vine", status: ASSUMPTION}
  k_nitrate_reduct: {value: 0.18, unit: "day⁻¹ @20°C", status: ASSUMPTION}
  urea_hydrolysis: {value: 0.30, unit: "day⁻¹ × f(T,вода)", status: ASSUMPTION, note: "уреаза"}
  nitrification: {value: 0.055, unit: "day⁻¹ × f(T,вода)", status: ASSUMPTION}
  leach_no3: {value: 0.022, unit: "day⁻¹ (вологе ≥0.7 → ×1.2)", status: ASSUMPTION}
  leach_nh4: {value: 0.004, unit: "day⁻¹", status: ASSUMPTION, note: "сорбція — менше вимивається"}
  denitrification: {value: 0.006, unit: "day⁻¹ × f(T) × f(вода)", status: ASSUMPTION}
  luxury_fraction: {value: 0.30, unit: "частка попиту (надлишок → листовий N)", status: ASSUMPTION}

tier2_terpenes:
  profile_muscat_blanc:
    value: {linalool: 0.50, geraniol: 0.20, nerol: 0.12, terpineol: 0.10, citronellol: 0.08}
    status: ASSUMPTION
    rationale: "Сортові профілі монотерпенсинтаз; верифікувати за E1 (ліналоол-домінантність мускату білого — очікувано)."
  gly_compound:
    value: {linalool: 0.035, geraniol: 0.055, nerol: 0.040, terpineol: 0.030, citronellol: 0.045, oxides: 0.020}
    unit: "day⁻¹ × f(ензиматика T)"
    status: ASSUMPTION
    note: "VvGT14 асоційований з гераніолом (найшвидший) — верифікувати назву/функцію."
  linalool_oxidation:
    value: 0.006
    unit: "day⁻¹ (+0.004/°C вище 30 °C)"
    status: ASSUMPTION
  odor_threshold:
    value: {linalool: 25, geraniol: 30, nerol: 45, terpineol: 300, citronellol: 100, oxides: 200}
    unit: "µg/L у вині"
    status: ASSUMPTION
    rationale: "Порядок порогів одоряції; точні значення — Francis et al. / Rapp — верифікувати (E1)."
  muscat_index:
    value: "100×OAV_Σ/(OAV_Σ+4)"
    status: ASSUMPTION
  load_dilution_exp:
    value: 0.25
    unit: "показник ступеня у (2кг/урожай)^x"
    status: ASSUMPTION
    rationale: "шкірочка/м'якуш: менші ягоди — вища концентрація терпенів [напрямок §3.5]"

berry_water_turgor:
  phaseI_water_factor: {value: "0.30+0.70×f(вода)", status: ASSUMPTION, note: "модель Локгарта, спрощено"}
  phaseIII_water_factor: {value: "0.55+0.45×f(вода)", status: ASSUMPTION}
